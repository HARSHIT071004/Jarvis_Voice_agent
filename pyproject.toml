[project]
name = "jarvis-voice-agent"
version = "0.1.0"
description = "Jarvis - local real-time voice assistant (wake word: jarvis)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sherpa-onnx>=1.13",
    "sentencepiece>=0.2,<0.2.1",  # 0.2.2 wheel crashes on import (0xC0000005) on some Windows setups
    "tzdata>=2024.1",   # IANA timezone database for zoneinfo on Windows (Phase 7, §16)
    "httpx>=0.27",      # research fetch + Google REST (Phases 5/7)
    "playwright>=1.40", # browser automation (Phase 6)
    "soundfile>=0.12",  # WAV/MP3 handling in voice test scripts (Phase 8)
    "edge-tts>=6.1",    # TTS for generated-voice tests (Phase 8)
    "pyttsx3>=2.90",    # offline TTS fallback (Phase 8)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app", "app.agent", "app.audio", "app.browser", "app.intelligence",
    "app.memory", "app.productivity", "app.research", "app.security", "app.tools",
    "app.utils", "app.wake",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
